plugins {
    // Minecraft 26.1+ is unobfuscated: use the non-remapping Loom plugin, no mappings line needed
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Needed at runtime by Cloth Config / Mod Menu (also handy in the dev environment)
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Cloth Config API 26.2.155+fabric (project 9s6osm5g, version Nv3xnWXd on Modrinth)
    implementation "maven.modrinth:9s6osm5g:Nv3xnWXd"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
